<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - ICE Detention Reports</title>
    <script>
      // Not every facility has a Spanish report yet. If a Spanish facility
      // page is missing, send the visitor to the English version instead.
      (function () {
        var path = window.location.pathname;
        if (/\/facility\/es\/[^/]+\.html$/.test(path)) {
          window.location.replace(
            path.replace("/facility/es/", "/facility/") +
              window.location.search +
              window.location.hash,
          );
        }
      })();
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        color: #2c3e50;
        background: #f8f9fa;
        text-align: center;
        padding: 4rem 1rem;
      }
      a {
        color: #3498db;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p><a href="/">Back to Detention Reports</a></p>
    <p lang="es">Página no encontrada. <a href="/es/">Volver a Detention Reports</a></p>
  </body>
</html>
